<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подготовка за класна работа №2 по Математика – 9. клас</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #0f172a;
      --muted: #475569;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --accent: #d97706;
      --good: #15803d;
      --bad: #b91c1c;
      --bg: #eef2f7;
      --card: #ffffff;
      --card-soft: #f1f5f9;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --good-bg: #f0fdf4;
      --good-border: #bbf7d0;
      --good-ink: #166534;
      --bad-bg: #fef2f2;
      --bad-border: #fecaca;
      --bad-ink: #991b1b;
      --warn-bg: #fef3c7;
      --warn-border: #fde68a;
      --warn-ink: #78350f;
      --option-bg: #ffffff;
      --option-hover: #eff6ff;
      --radius: 12px;
      --math-font: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", Times, serif;
    }

    [data-theme="dark"] {
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #93c5fd;
      --accent: #fbbf24;
      --good: #4ade80;
      --bad: #f87171;
      --bg: #0f172a;
      --card: #1e293b;
      --card-soft: #334155;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --border: #334155;
      --border-strong: #475569;
      --good-bg: rgba(74, 222, 128, 0.12);
      --good-border: rgba(74, 222, 128, 0.35);
      --good-ink: #86efac;
      --bad-bg: rgba(248, 113, 113, 0.12);
      --bad-border: rgba(248, 113, 113, 0.35);
      --bad-ink: #fca5a5;
      --warn-bg: rgba(251, 191, 36, 0.12);
      --warn-border: rgba(251, 191, 36, 0.35);
      --warn-ink: #fcd34d;
      --option-bg: #1e293b;
      --option-hover: #334155;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(124, 58, 237, 0.10), transparent 55%),
        radial-gradient(ellipse at 85% 10%, rgba(29, 78, 216, 0.10), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(217, 119, 6, 0.08), transparent 60%),
        radial-gradient(ellipse at 0% 60%, rgba(21, 128, 61, 0.07), transparent 55%);
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    [data-theme="dark"] body {
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(124, 58, 237, 0.18), transparent 55%),
        radial-gradient(ellipse at 85% 10%, rgba(29, 78, 216, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(251, 191, 36, 0.08), transparent 60%);
    }

    /* Интерактивен фон — canvas с плаващи математически символи */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      transition: opacity 0.5s;
    }
    [data-theme="dark"] .bg-canvas {
      opacity: 0.35;
    }

    .app, .top-controls { position: relative; z-index: 1; }

    .app {
      width: min(1300px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 44px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 30px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 2.5vw, 32px);
      color: var(--ink);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--card);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .stat strong { font-size: 24px; color: var(--primary); font-weight: 800; }
    [data-theme="dark"] .stat { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .game-layout {
      display: grid;
      grid-template-columns: 1.15fr 380px;
      gap: 24px;
      align-items: start;
    }

    .task-container {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px;
      min-height: 600px;
    }

    .task-context {
      background: var(--card-soft);
      border-left: 5px solid var(--primary);
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 24px;
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink);
    }

    .topic-pill {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      background: var(--card-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .visual-box {
      margin: 0 auto 30px;
      display: flex;
      justify-content: center;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
    }

    .svg-visual { width: 100%; max-width: 420px; height: auto; }
    .svg-visual text { font-family: var(--math-font); font-style: italic; font-size: 16px; fill: var(--ink); }
    .svg-visual .point { font-style: normal; font-weight: 700; }
    .svg-visual line, .svg-visual path, .svg-visual polygon, .svg-visual circle, .svg-visual polyline { stroke: var(--ink); }
    .svg-visual path[fill]:not([fill="none"]),
    .svg-visual polygon[fill]:not([fill="none"]),
    .svg-visual circle[fill]:not([fill="none"]) { fill: var(--ink); }
    [data-theme="dark"] .svg-visual { filter: invert(0.92) hue-rotate(180deg); }

    .math {
      font-family: var(--math-font);
      font-style: italic;
      white-space: nowrap;
      font-size: 1.1em;
      letter-spacing: 0.2px;
    }
    .math-normal { font-family: var(--math-font); font-style: normal; }

    /* KaTeX корекции — да наследи цвета от родителя */
    .katex { font-size: 1.05em; color: inherit; }
    .katex-display { margin: 0.6em 0; }
    [data-theme="dark"] .katex .mord,
    [data-theme="dark"] .katex .mbin,
    [data-theme="dark"] .katex .mrel,
    [data-theme="dark"] .katex .mopen,
    [data-theme="dark"] .katex .mclose,
    [data-theme="dark"] .katex .mpunct,
    [data-theme="dark"] .katex .minner,
    [data-theme="dark"] .katex { color: var(--ink); }

    .step-box {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
      background: var(--card);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .step-box.locked {
      opacity: 0.4;
      max-height: 80px;
      overflow: hidden;
      pointer-events: none;
      filter: grayscale(100%) blur(1.5px);
      border-color: var(--border-strong);
    }

    .step-box.unlocked {
      opacity: 1;
      max-height: 2000px;
      filter: none;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
    }

    .step-box.completed {
      border-color: var(--border-strong);
      background: var(--card-soft);
    }

    .step-label {
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .step-label .status-icon { font-size: 16px; }

    .question-text {
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 20px;
      font-weight: 500;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      border: 2px solid var(--border);
      background: var(--option-bg);
      border-radius: 8px;
      padding: 16px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--math-font);
      font-style: italic;
      color: var(--ink);
    }

    .option .prefix {
      font-family: "Segoe UI", sans-serif;
      font-style: normal;
      font-weight: 700;
      margin-right: 10px;
      color: var(--muted);
    }

    .option:hover:not(:disabled) { border-color: var(--primary); background: var(--option-hover); transform: translateY(-2px); }
    .option.selected { border-color: var(--primary); background: var(--option-hover); }
    .option.correct { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); font-weight: bold;}
    .option.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad-ink); }

    .feedback {
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 20px;
      display: none;
      line-height: 1.5;
    }

    .feedback.show { display: block; animation: fadeIn 0.4s ease; }
    .feedback.good { background: var(--good-bg); border: 1px solid var(--good-border); color: var(--good-ink); }
    .feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad-ink); }
    .feedback .feedback-title { font-weight: 700; margin-bottom: 6px; }
    .feedback .solution { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(127,127,127,0.3); font-weight: 500; }

    .sidebar { display: flex; flex-direction: column; gap: 24px; }

    .puzzle-card, .map {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
    }

    .puzzle-card h2, .map h2 {
      margin: 0 0 16px; font-size: 15px; text-transform: uppercase; color: var(--muted); text-align: center; letter-spacing: 0.5px;
    }

    .puzzle-board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2px;
      border-radius: 8px;
      overflow: hidden;
      background: #1e293b;
      border: 2px solid #334155;
      aspect-ratio: 3 / 2;
      position: relative;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
    }

    .puzzle-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .tile {
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Single tile — изцяло покрита, отваря се изцяло */
    .tile.single-tile {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.2);
      transition: opacity 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tile.single-tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .tile.single-tile.revealed {
      opacity: 0;
    }

    /* Chain tile — фон е прозрачен; покритието идва от секторите. */
    .tile.chain-tile {
      background: transparent;
    }

    .tile.chain-tile svg {
      position: absolute;
      inset: 0;
    }

    .tile .sector {
      fill: #3f4e63;
      stroke: rgba(15, 23, 42, 0.5);
      stroke-width: 0.6;
      transition: opacity 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.7s ease;
      transform-origin: 50% 50%;
    }

    .tile .sector.revealed {
      opacity: 0;
      transform: scale(0.4) rotate(15deg);
    }

    .tile .sector.correct {
      animation: sectorFlash 0.6s ease;
    }

    .tile .sector.wrong {
      animation: sectorFlashWrong 0.6s ease;
    }

    @keyframes sectorFlash {
      0% { fill: #15803d; }
      100% { fill: #3f4e63; }
    }
    @keyframes sectorFlashWrong {
      0% { fill: #b91c1c; }
      100% { fill: #3f4e63; }
    }

    /* Малка точка в центъра на chain плочка — обозначава, че е "стъпкова" */
    .tile.chain-tile::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 4px; height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }

    /* tile-indicator премахнат за по-чист UI */

    .puzzle-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      font-style: italic;
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .dot {
      border: 2px solid var(--border);
      border-radius: 6px;
      aspect-ratio: 1;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
      background: var(--card-soft);
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
    }

    .dot:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .dot.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.1); box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3);}
    .dot.correct { background: var(--good); color: white; border-color: var(--good); }
    .dot.wrong { background: var(--bad); color: white; border-color: var(--bad); }
    .dot.chained { border-bottom: 4px solid #9333ea; border-radius: 6px 6px 3px 3px; }

    .legend { margin-top: 24px; font-size: 13px; color: var(--muted); line-height: 2; }
    .legend-item { display: flex; align-items: center; gap: 10px; }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
      width: 100%;
      text-align: center;
      font-family: "Segoe UI", sans-serif;
      margin-top: 24px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-row .btn { margin-top: 0; }

    .primary { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3); }
    .primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .secondary { background: var(--card); color: var(--primary); border: 2px solid var(--primary); }
    .secondary:hover { background: var(--option-hover); }

    .progress-wrap {
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #3b82f6);
      transition: width 0.4s ease;
    }

    /* Преглед на грешките */
    .review-list { margin-top: 24px; }
    .review-item {
      border: 1px solid var(--border);
      border-left: 4px solid var(--bad);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 14px;
      background: var(--card);
      text-align: left;
    }
    .review-item .rq { font-size: 16px; line-height: 1.5; margin-bottom: 12px; color: var(--ink); }
    .review-item .ra { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .review-item .ra strong { color: var(--ink); }
    .review-item .rsol { font-size: 14px; padding: 10px 12px; background: var(--good-bg); border-radius: 6px; color: var(--good-ink); margin-top: 10px; line-height: 1.5; }
    .review-item .topic-pill { margin-bottom: 8px; }

    .restore-banner {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--warn-ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .restore-banner button {
      border: 0;
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .restore-banner button.dismiss {
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Контроли отгоре — бутони за тема и звук */
    .top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      padding: 0;
      line-height: 1;
    }
    .icon-btn:hover { transform: translateY(-2px) scale(1.05); }
    .icon-btn:active { transform: scale(0.95); }

    /* Подобрения за мобилни устройства */
    @media (max-width: 1024px) {
      .game-layout { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; }
      .puzzle-card, .map { flex: 1; }
      .dots { grid-template-columns: repeat(10, 1fr); }
    }

    @media (max-width: 768px) {
      .app { width: calc(100% - 16px); padding: 12px 0 32px; }
      header { padding: 20px 16px; margin-bottom: 16px; }
      header h1 { font-size: 22px; margin-bottom: 8px; }
      header p { font-size: 14px; }
      .top-controls { top: 8px; right: 8px; gap: 6px; }
      .icon-btn { width: 38px; height: 38px; font-size: 17px; }
      .sidebar { flex-direction: column; gap: 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
      .stat { padding: 10px 8px; }
      .stat small { font-size: 10px; margin-bottom: 4px; }
      .stat strong { font-size: 18px; }
      .options { grid-template-columns: 1fr; gap: 10px; }
      .option { padding: 14px; font-size: 15px; min-height: 50px; }
      .dots { grid-template-columns: repeat(6, 1fr); gap: 6px; }
      .dot { font-size: 11px; }
      .task-container { padding: 16px; min-height: 400px; }
      .task-context { font-size: 15px; padding: 14px; }
      .step-box { padding: 16px; margin-bottom: 14px; }
      .question-text { font-size: 16px; margin-bottom: 14px; }
      .visual-box { padding: 12px; margin-bottom: 20px; }
      .puzzle-card, .map { padding: 16px; }
      .btn { padding: 14px 18px; font-size: 15px; }
      .btn-row { grid-template-columns: 1fr; gap: 10px; }
      .feedback { font-size: 14px; padding: 12px 14px; }
      .game-layout { gap: 16px; }
    }

    @media (max-width: 420px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .puzzle-card h2, .map h2 { font-size: 13px; }
      .option { font-size: 14px; padding: 12px; }
      .math { font-size: 1em; }
    }

    /* ====== СТАРТОВ ЕКРАН ====== */
    .header-subtitle {
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      max-width: 800px;
      min-height: 1.5em;
    }

    .start-screen {
      display: grid;
      gap: 20px;
      animation: fadeIn 0.5s ease;
    }

    .instructions-card,
    .credits-card,
    .start-form {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 28px;
    }

    /* Сгъваеми указания */
    .instructions-card { padding: 0; overflow: hidden; }
    .instructions-toggle {
      width: 100%;
      background: transparent;
      border: none;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
      transition: background 0.2s;
      position: relative;
    }
    .instructions-toggle:hover { background: var(--option-hover); }
    .instructions-toggle:focus-visible {
      outline: 3px solid rgba(29, 78, 216, 0.3);
      outline-offset: -3px;
    }

    /* Когато картичката е свита — бутонът „диша" и привлича внимание */
    .instructions-card.collapsed .instructions-toggle {
      background: linear-gradient(135deg,
                    rgba(29, 78, 216, 0.08) 0%,
                    rgba(124, 58, 237, 0.10) 50%,
                    rgba(217, 119, 6, 0.08) 100%);
      background-size: 200% 200%;
      animation: instructionsGlow 3s ease-in-out infinite,
                 instructionsGradient 6s ease infinite;
    }
    .instructions-card.collapsed .instructions-toggle:hover {
      background: linear-gradient(135deg,
                    rgba(29, 78, 216, 0.18) 0%,
                    rgba(124, 58, 237, 0.20) 50%,
                    rgba(217, 119, 6, 0.18) 100%);
    }

    @keyframes instructionsGlow {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(124, 58, 237, 0); }
      50%      { box-shadow: inset 0 0 40px 0 rgba(124, 58, 237, 0.15); }
    }
    @keyframes instructionsGradient {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .instructions-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      /* Ярък градиентен текст */
      background: linear-gradient(90deg, #1d4ed8, #7c3aed, #d97706, #7c3aed, #1d4ed8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 3.5s linear infinite;
    }
    @keyframes textShimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .ic-icon {
      font-size: 22px;
      /* Емоджито остава цветно — отменяме text-clip за него */
      -webkit-text-fill-color: initial;
      animation: iconBounce 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0) rotate(0); }
      30%      { transform: translateY(-3px) rotate(-6deg); }
      60%      { transform: translateY(0) rotate(6deg); }
    }
    .ic-text { line-height: 1; }

    /* Малък „click ме" таг до стрелката, докато е свито */
    .instructions-toggle::after {
      content: 'кликни тук';
      position: absolute;
      right: 56px;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--primary);
      background: rgba(124, 58, 237, 0.12);
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      animation: hintPulse 2s ease-in-out infinite;
      pointer-events: none;
    }
    .instructions-card.expanded .instructions-toggle::after { display: none; }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.6; transform: translateX(0); }
      50%      { opacity: 1;   transform: translateX(-3px); }
    }

    /* На мобилно скриваме „кликни тук", за да не се препокрива */
    @media (max-width: 540px) {
      .instructions-toggle::after { display: none; }
    }

    .instructions-chevron {
      font-size: 24px;
      color: var(--primary);
      transition: transform 0.3s ease, color 0.3s;
      line-height: 1;
      font-weight: 800;
    }
    .instructions-card.collapsed .instructions-chevron {
      animation: chevronBounce 1.6s ease-in-out infinite;
    }
    .instructions-card.expanded .instructions-chevron { transform: rotate(180deg); }
    @keyframes chevronBounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(4px); }
    }

    .instructions-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0 24px;
    }
    .instructions-card.expanded .instructions-body {
      max-height: 600px;
      padding: 0 24px 24px;
    }

    .typed-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      min-height: 2em;
      white-space: pre-wrap;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .typed-text .caret {
      display: inline-block;
      width: 2px;
      background: var(--primary);
      animation: blink 1s steps(2, start) infinite;
      vertical-align: text-bottom;
      height: 1.1em;
      margin-left: 1px;
    }

    @keyframes blink { to { visibility: hidden; } }

    .typed-text strong { color: var(--primary); font-weight: 700; }
    .typed-text em { color: var(--accent); font-style: normal; font-weight: 600; }

    /* Кредити с анимирано човече */
    .credits-card {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: center;
    }

    .mathlete-wrap {
      display: flex;
      justify-content: center;
    }

    .mathlete {
      width: 220px;
      height: auto;
    }

    /* Леко олюляване на цялата фигура */
    .mathlete .figure {
      transform-origin: 70px 145px;
      animation: figureSway 4s ease-in-out infinite;
    }
    @keyframes figureSway {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }

    /* Триъгълникът се олюлява заедно с фигурата */
    .mathlete .held-triangle {
      transform-origin: 195 130;
      animation: triangleSway 4s ease-in-out infinite;
    }
    @keyframes triangleSway {
      0%, 100% { transform: rotate(1deg) translateY(0); }
      50%      { transform: rotate(-1deg) translateY(-2px); }
    }

    /* Височината се „чертае" циклично — strokeDasharray анимация */
    .mathlete .triangle-altitude {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawAltitude 3.5s ease-in-out infinite;
    }
    .mathlete .triangle-rightangle {
      opacity: 0;
      animation: showRightAngle 3.5s ease-in-out infinite;
    }
    @keyframes drawAltitude {
      0%   { stroke-dashoffset: 80; }
      30%  { stroke-dashoffset: 0;  }
      75%  { stroke-dashoffset: 0;  }
      100% { stroke-dashoffset: 80; }
    }
    @keyframes showRightAngle {
      0%, 30% { opacity: 0; }
      40%, 75% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Дясна ръка с молива — лек подскок (сякаш току-що приключи чертеж) */
    .mathlete .arm-right {
      transform-origin: 70px 95px;
      animation: armRightWiggle 3.5s ease-in-out infinite;
    }
    @keyframes armRightWiggle {
      0%, 100% { transform: rotate(0deg); }
      30%   { transform: rotate(-3deg) translateY(-1px); }
      70%   { transform: rotate(2deg); }
    }

    /* Лявата ръка остава по-стабилна */
    .mathlete .arm-left {
      transform-origin: 70px 95px;
      animation: armLeftHold 4s ease-in-out infinite;
    }
    @keyframes armLeftHold {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-1deg); }
    }

    /* Носещи се около главата математически символи */
    .mathlete .float-symbol {
      font-family: var(--math-font);
      font-style: italic;
      font-size: 18px;
      font-weight: 700;
      opacity: 0.75;
    }
    .mathlete .float-symbol.s1 { animation: float 3s   ease-in-out infinite; }
    .mathlete .float-symbol.s2 { animation: float 3.5s ease-in-out infinite; animation-delay: 0.4s; }
    .mathlete .float-symbol.s3 { animation: float 4s   ease-in-out infinite; animation-delay: 0.9s; }
    .mathlete .float-symbol.s4 { animation: float 3.3s ease-in-out infinite; animation-delay: 1.3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50%      { transform: translateY(-8px); opacity: 1; }
    }

    .credits-text {
      font-size: 15px;
      line-height: 1.9;
      color: var(--ink);
    }
    .credits-text strong { color: var(--primary); }

    /* Форма за име + старт бутон */
    .start-form {
      text-align: center;
    }

    .name-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .name-input {
      width: 100%;
      max-width: 420px;
      padding: 14px 18px;
      font-size: 17px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--option-bg);
      color: var(--ink);
      font-family: inherit;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .name-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.15);
    }
    .name-input.invalid {
      border-color: var(--bad);
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .name-error {
      color: var(--bad);
      font-size: 14px;
      min-height: 1.2em;
      margin: 8px 0 16px;
      font-weight: 600;
    }

    /* Атрактивен анимиран бутон */
    .start-btn {
      position: relative;
      overflow: hidden;
      border: none;
      padding: 18px 48px;
      font-size: 19px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 50%, #1d4ed8 100%);
      background-size: 200% 200%;
      box-shadow: 0 10px 30px rgba(29, 78, 216, 0.4), 0 0 0 0 rgba(124, 58, 237, 0.5);
      transition: transform 0.2s, box-shadow 0.3s;
      font-family: "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.5px;
      margin-top: 8px;
      animation: gradientShift 4s ease-in-out infinite, pulse 2.5s ease-in-out infinite;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 40px rgba(29, 78, 216, 0.55), 0 0 0 6px rgba(124, 58, 237, 0.2);
    }
    .start-btn:active { transform: translateY(-1px) scale(1.01); }

    .start-btn-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shine 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 10px 30px rgba(29, 78, 216, 0.4), 0 0 0 0 rgba(124, 58, 237, 0.6); }
      50% { box-shadow: 0 10px 30px rgba(29, 78, 216, 0.4), 0 0 0 12px rgba(124, 58, 237, 0); }
    }
    @keyframes shine {
      0% { left: -100%; }
      55%, 100% { left: 200%; }
    }

    .start-btn-label { position: relative; z-index: 1; }

    /* Лента с името на играча по време на игра */
    .player-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-bar strong { color: var(--ink); font-weight: 700; }

    @media (max-width: 768px) {
      .credits-card { grid-template-columns: 1fr; text-align: center; gap: 16px; }
      .mathlete { width: 180px; }
      .instructions-card, .credits-card, .start-form { padding: 18px; }
      .start-btn { padding: 16px 32px; font-size: 17px; width: 100%; max-width: 420px; }
      .typed-text { font-size: 15px; min-height: 14em; }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>

  <div class="top-controls">
    <button id="soundToggle" class="icon-btn" title="Звукови ефекти" aria-label="Превключи звук">🔊</button>
    <button id="themeToggle" class="icon-btn" title="Светла/тъмна тема" aria-label="Превключи тема">🌙</button>
  </div>

  <main class="app">
    <header>
      <h1>Математически пъзел: Отключи класната работа</h1>
      <p id="headerSubtitle" class="header-subtitle"></p>
    </header>

    <!-- ===== СТАРТОВ ЕКРАН ===== -->
    <section id="startScreen" class="start-screen">
      <div class="instructions-card collapsed" id="instructionsCard">
        <button type="button" class="instructions-toggle" id="instructionsToggle" aria-expanded="false" aria-controls="typedInstructions">
          <span class="instructions-title">
            <span class="ic-icon">📖</span>
            <span class="ic-text">Как се играе</span>
          </span>
          <span class="instructions-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="instructions-body" id="instructionsBody">
          <div id="typedInstructions" class="typed-text"></div>
        </div>
      </div>

      <div class="credits-card">
        <div class="mathlete-wrap">
          <svg class="mathlete" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Носещи се около главата математически символи -->
            <g class="floating-math">
              <text class="float-symbol s1" x="18" y="22" fill="#1d4ed8">π</text>
              <text class="float-symbol s2" x="200" y="18" fill="#15803d">√</text>
              <text class="float-symbol s3" x="210" y="78" fill="#9333ea">∞</text>
              <text class="float-symbol s4" x="22" y="76" fill="#d97706">α</text>
            </g>

            <!-- Триъгълник, който човечето държи (голям, на преден план) -->
            <g class="held-triangle">
              <!-- Триъгълникът сам — голям равностранен, ABC -->
              <polygon points="155,170 235,170 195,90"
                       fill="rgba(29, 78, 216, 0.10)"
                       stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
              <!-- Точки на върховете -->
              <circle cx="155" cy="170" r="3.2" fill="#1d4ed8"/>
              <circle cx="235" cy="170" r="3.2" fill="#1d4ed8"/>
              <circle cx="195" cy="90"  r="3.2" fill="#1d4ed8"/>
              <!-- Етикети A, B, C -->
              <text x="146" y="184" fill="#0f172a" font-family="Cambria Math, serif" font-size="14" font-weight="700">A</text>
              <text x="238" y="184" fill="#0f172a" font-family="Cambria Math, serif" font-size="14" font-weight="700">B</text>
              <text x="190" y="84"  fill="#0f172a" font-family="Cambria Math, serif" font-size="14" font-weight="700">C</text>
              <!-- Височина от C, която „се чертае" -->
              <line class="triangle-altitude" x1="195" y1="90" x2="195" y2="170"
                    stroke="#15803d" stroke-width="2" stroke-dasharray="3 3"/>
              <!-- Малък правоъгълник за прав ъгъл на основата -->
              <path class="triangle-rightangle" d="M 195 164 L 201 164 L 201 170" fill="none" stroke="#15803d" stroke-width="1.5"/>
            </g>

            <!-- Тяло на човечето -->
            <g class="figure">
              <!-- Глава -->
              <circle cx="70" cy="60" r="20" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
              <!-- Усмивка -->
              <path d="M 62 65 Q 70 72 78 65" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
              <!-- Очи -->
              <circle cx="63" cy="56" r="1.7" fill="#0f172a"/>
              <circle cx="77" cy="56" r="1.7" fill="#0f172a"/>
              <!-- Коса -->
              <path d="M 52 52 Q 70 36 88 52" fill="#78350f" stroke="#0f172a" stroke-width="1.5"/>
              <!-- Врат + горна част на тяло -->
              <path d="M 70 80 L 70 145" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

              <!-- Лява ръка — държи долен ляв връх на триъгълника (точка A) -->
              <g class="arm-left">
                <path d="M 70 95 Q 105 110 155 168" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <!-- Длан -->
                <circle cx="155" cy="168" r="4" fill="#fde68a" stroke="#0f172a" stroke-width="1.5"/>
              </g>

              <!-- Дясна ръка — държи горния връх (точка C) и сочи с молив -->
              <g class="arm-right">
                <path d="M 70 95 Q 130 70 193 92" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <!-- Молив в края (около точка C) -->
                <g transform="translate(188, 84) rotate(35)">
                  <rect x="0" y="0" width="14" height="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
                  <polygon points="14,0 20,2 14,4" fill="#fbbf24" stroke="#0f172a" stroke-width="1"/>
                </g>
              </g>

              <!-- Крака -->
              <path d="M 70 145 L 55 188" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <path d="M 70 145 L 85 188" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <!-- Обувки -->
              <ellipse cx="52" cy="192" rx="9" ry="3.5" fill="#1e293b"/>
              <ellipse cx="88" cy="192" rx="9" ry="3.5" fill="#1e293b"/>
            </g>
          </svg>
        </div>
        <div class="credits-text">
          <div><strong>Идея и педагогически решения:</strong> Валя Витковска</div>
          <div><strong>Реализация:</strong> Claude</div>
        </div>
      </div>

      <div class="start-form">
        <label for="playerName" class="name-label">Въведи името си, за да започнеш:</label>
        <input type="text" id="playerName" class="name-input" placeholder="Име и фамилия" autocomplete="name" maxlength="60" required>
        <div id="nameError" class="name-error"></div>
        <button id="startBtn" class="start-btn">
          <span class="start-btn-label">▶  Старт на пъзела</span>
          <span class="start-btn-shine"></span>
        </button>
      </div>
    </section>

    <!-- ===== ИГРАЛЕН EКРАН (скрит до старт) ===== -->
    <div id="gameArea" style="display: none;">
      <div class="player-bar" id="playerBar"></div>

      <section class="stats">
        <div class="stat"><small>Въпрос</small><strong id="statQuestion">0 / 0</strong></div>
        <div class="stat"><small>Точки</small><strong id="statScore">0</strong></div>
        <div class="stat"><small>Верни</small><strong id="statCorrect">0</strong></div>
        <div class="stat"><small>Статус</small><strong id="statLevel">—</strong></div>
      </section>

      <div id="restoreBanner"></div>

      <section class="game-layout">
        <div class="task-container" id="screen"></div>

        <div class="sidebar">
          <aside class="puzzle-card">
            <h2>Скрита картинка</h2>
            <div class="puzzle-board" id="puzzleBoard"></div>
            <div class="puzzle-hint" id="puzzleHint">Решавайте, за да откриете изображението</div>
          </aside>


        <aside class="map">
          <h2>Навигация</h2>
          <div class="progress-wrap"><div class="progress" id="progress"></div></div>
          <div class="dots" id="dots"></div>

          <div class="legend">
            <div class="legend-item"><span style="display:inline-block; width:14px; height:14px; background:var(--primary); border-radius:4px;"></span> Текущ въпрос</div>
            <div class="legend-item"><span style="display:inline-block; width:14px; height:14px; background:var(--good); border-radius:4px;"></span> Верен отговор</div>
            <div class="legend-item"><span style="display:inline-block; width:14px; height:14px; background:var(--bad); border-radius:4px;"></span> Грешен отговор</div>
            <div class="legend-item"><span style="display:inline-block; width:14px; height:6px; background:#9333ea; border-radius:3px;"></span> Комплексна задача (стъпки)</div>
          </div>
        </aside>
      </div>
    </section>
    </div><!-- /#gameArea -->
  </main>

  <script>
    const STORAGE_KEY = "math9_klasna2_v3";
    const THEME_KEY = "math9_theme";
    const SOUND_KEY = "math9_sound";

    // ===== Тъмен / светъл режим =====
    (function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      // По подразбиране — според системните предпочитания на потребителя
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      // Update icon when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      });
    })();

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem(THEME_KEY, 'light');
        document.getElementById('themeToggle').textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem(THEME_KEY, 'dark');
        document.getElementById('themeToggle').textContent = '☀️';
      }
    }

    // ===== Звукови ефекти (Web Audio API — без външни файлове) =====
    let soundEnabled = localStorage.getItem(SOUND_KEY) !== 'off';
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          return null;
        }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', volume = 0.18) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.start(now);
      osc.stop(now + duration);
    }

    // ===== Анимирано писане (typewriter) =====
    function typeInto(element, htmlText, speed = 22) {
      if (!element) return;
      element.innerHTML = '';
      const caret = document.createElement('span');
      caret.className = 'caret';
      caret.innerHTML = '&nbsp;';
      element.appendChild(caret);

      // Парсваме HTML-а в токени: tag или char
      const tokens = [];
      let i = 0;
      while (i < htmlText.length) {
        if (htmlText[i] === '<') {
          const end = htmlText.indexOf('>', i);
          if (end === -1) break;
          tokens.push({ type: 'tag', value: htmlText.substring(i, end + 1) });
          i = end + 1;
        } else {
          tokens.push({ type: 'char', value: htmlText[i] });
          i++;
        }
      }

      let idx = 0;
      function step() {
        if (idx >= tokens.length) return;
        const t = tokens[idx++];
        // Слагаме съдържанието преди карета
        if (t.type === 'tag') {
          caret.insertAdjacentHTML('beforebegin', t.value);
          // Тагове са „бързи"
          requestAnimationFrame(step);
        } else {
          // Escape за &, < и >
          const safe = t.value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          caret.insertAdjacentHTML('beforebegin', safe);
          // Пауза за пунктуация
          let delay = speed;
          if ('.!?:'.includes(t.value)) delay = speed * 6;
          else if (',;'.includes(t.value)) delay = speed * 3;
          setTimeout(step, delay);
        }
      }
      step();
    }

    // ===== Интерактивен фон с плаващи математически символи =====
    let bgState = null;
    function initInteractiveBackground() {
      if (bgState) return; // вече инициализиран
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext && canvas.getContext('2d');
      if (!ctx) return; // canvas не се поддържа (или JSDOM test)

      // Уважаваме prefers-reduced-motion
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const symbols = ['π', '√', '∑', '∫', '∞', 'α', 'β', 'γ', 'θ', 'Δ', '°', 'φ',
                       '∠', '⊥', '∥', '△', '◯', '≈', '≠', '≤', '≥', '±', '÷',
                       'a²', 'b²', 'c²', 'x²', 'sin', 'cos', 'tan'];

      const palette = ['#1d4ed8', '#7c3aed', '#15803d', '#d97706', '#0891b2'];

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      resize();

      // Брой символи зависи от размера на екрана
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isMobile = w < 600;
      const count = isMobile ? 18 : 32;

      const items = [];
      for (let i = 0; i < count; i++) {
        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
        items.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          size: 16 + Math.random() * 28,
          symbol: symbol,
          color: palette[Math.floor(Math.random() * palette.length)],
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.005,
          alpha: 0.25 + Math.random() * 0.35,
          // За интерактивност — текущо изместване
          dx: 0, dy: 0
        });
      }

      bgState = { canvas, ctx, items, mouseX: -1000, mouseY: -1000, w, h, reduced };

      // Listener за курсор/допир
      function onMove(ev) {
        let cx, cy;
        if (ev.touches && ev.touches[0]) {
          cx = ev.touches[0].clientX;
          cy = ev.touches[0].clientY;
        } else {
          cx = ev.clientX;
          cy = ev.clientY;
        }
        bgState.mouseX = cx;
        bgState.mouseY = cy;
      }
      function onLeave() {
        bgState.mouseX = -1000;
        bgState.mouseY = -1000;
      }
      // Слушаме на window (canvas-ът е pointer-events: none)
      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('mouseout', onLeave, { passive: true });

      // Click — създавай малък „ripple" ефект
      window.addEventListener('click', (e) => {
        if (!bgState) return;
        // Импулс на близките символи
        const cx = e.clientX, cy = e.clientY;
        bgState.items.forEach(it => {
          const dx = it.x - cx, dy = it.y - cy;
          const d2 = dx*dx + dy*dy;
          if (d2 < 200 * 200) {
            const d = Math.sqrt(d2) || 1;
            const force = 4 * (1 - d / 200);
            it.vx += (dx / d) * force;
            it.vy += (dy / d) * force;
          }
        });
      }, { passive: true });

      window.addEventListener('resize', () => {
        resize();
        if (bgState) {
          bgState.w = window.innerWidth;
          bgState.h = window.innerHeight;
        }
      });

      function tick() {
        if (!bgState) return;
        const { ctx, items, w, h, reduced } = bgState;
        const cw = window.innerWidth;
        const ch = window.innerHeight;
        ctx.clearRect(0, 0, cw, ch);

        items.forEach(it => {
          // Интеракция с мишката: при близост — побягват от курсора
          if (!reduced) {
            const dx = it.x - bgState.mouseX;
            const dy = it.y - bgState.mouseY;
            const d2 = dx*dx + dy*dy;
            const repelRadius = 140;
            if (d2 < repelRadius * repelRadius && d2 > 0) {
              const d = Math.sqrt(d2);
              const push = (1 - d / repelRadius) * 0.6;
              it.vx += (dx / d) * push;
              it.vy += (dy / d) * push;
            }
          }

          // Триене (за да не се ускоряват вечно)
          it.vx *= 0.96;
          it.vy *= 0.96;

          // Базово плаване (Brownian)
          if (!reduced) {
            it.vx += (Math.random() - 0.5) * 0.04;
            it.vy += (Math.random() - 0.5) * 0.04;
          }

          // Ограничение на скоростта
          const maxV = 1.8;
          const v = Math.hypot(it.vx, it.vy);
          if (v > maxV) {
            it.vx = (it.vx / v) * maxV;
            it.vy = (it.vy / v) * maxV;
          }

          // Движение
          it.x += it.vx;
          it.y += it.vy;
          it.rotation += it.rotSpeed;

          // Wrap-around
          if (it.x < -40) it.x = cw + 20;
          if (it.x > cw + 40) it.x = -20;
          if (it.y < -40) it.y = ch + 20;
          if (it.y > ch + 40) it.y = -20;

          // Рисуваме
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rotation);
          ctx.globalAlpha = it.alpha;
          ctx.fillStyle = it.color;
          ctx.font = `italic 700 ${it.size}px "Cambria Math", "STIX Two Math", serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(it.symbol, 0, 0);
          ctx.restore();
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ===== KaTeX рендериране =====

      try {

            { left: "$",  right: "$",  display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false,
          errorColor: "#b91c1c",
          strict: "ignore"
        });
      } catch (e) {

    }

      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initPuzzleGrid(puzzle) {
      puzzleBoard.innerHTML = '';
