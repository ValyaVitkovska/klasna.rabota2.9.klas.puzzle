      const bg = document.createElement('div');
      bg.className = 'puzzle-bg';
      if (puzzle.type === 'image') {
        const img = document.createElement('img');
        img.src = puzzle.src;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.display = 'block';
        bg.appendChild(img);
      } else if (puzzle.svg) {
        bg.innerHTML = puzzle.svg;
        const svgEl = bg.querySelector('svg');
        if (svgEl) {
          svgEl.style.width = '100%';
          svgEl.style.height = '100%';
          svgEl.style.display = 'block';
        }
      }
      puzzleBoard.appendChild(bg);

      // Построяваме tileMeta — по 1 плочка за всеки екран (single или chain)
      tileMeta = [];
      screens.forEach((scr, sIdx) => {
        if (scr.type === 'single') {
          tileMeta.push({ screenIdx: sIdx, type: 'single', totalSectors: 1, sectorsRevealed: 0 });
        } else {
          tileMeta.push({ screenIdx: sIdx, type: 'chain', totalSectors: scr.steps.length, sectorsRevealed: 0 });
        }
      });

      // Рендиране на плочките
      tileMeta.forEach((meta, tileIdx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${tileIdx}`;

        if (meta.type === 'chain') {
          // Триъгълни сектори за стъпките
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 100 100');
          svg.setAttribute('preserveAspectRatio', 'none');
          svg.style.width = '100%';
          svg.style.height = '100%';
          svg.style.display = 'block';

          const cx = 50, cy = 50;
          const n = meta.totalSectors;
          // Сектори започват от върха (-90°) и въртят по часовниковата стрелка
          for (let k = 0; k < n; k++) {
            const startAngle = -Math.PI / 2 + (k / n) * Math.PI * 2;
            const endAngle = -Math.PI / 2 + ((k + 1) / n) * Math.PI * 2;
            // Изчисляваме точки на периферията — голяма "звезда" около квадрата за пълно покритие
            // По-просто: използваме голям радиус и clipPath не е нужен, защото SVG ще се изреже от tile-а
            const r = 100; // достатъчно голям, за да покрие цялото квадратче
            const x1 = cx + r * Math.cos(startAngle);
            const y1 = cy + r * Math.sin(startAngle);
            const x2 = cx + r * Math.cos(endAngle);
            const y2 = cy + r * Math.sin(endAngle);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;
            path.setAttribute('d', d);
            path.setAttribute('class', 'sector');
            path.setAttribute('id', `tile-${tileIdx}-sec-${k}`);
            svg.appendChild(path);
          }
          tile.appendChild(svg);
          tile.classList.add('chain-tile');
        } else {
          // Single tile — въпросителна
          tile.classList.add('single-tile');
        }

        puzzleBoard.appendChild(tile);
      });

      puzzleHintEl.textContent = "Решавайте, за да откриете изображението";
    }

    // За даден globalIdx намира номера на плочка и сектора в нея
    function findTileAndSector(globalIdx) {
      const q = allQuestionsFlat[globalIdx];
      const sIdx = q.screenIdx;
      // tileIdx == screenIdx (1 плочка на екран)
      const tileIdx = sIdx;
      let sectorIdx = 0;
      const scr = screens[sIdx];
      if (scr.type === 'chain') {
        sectorIdx = scr.steps.findIndex(st => st.globalIdx === globalIdx);
      }
      return { tileIdx, sectorIdx };
    }

    // ===== Запазване/Възстановяване =====
    function saveState() {
      try {
        const state = {
          puzzleIdx: puzzleImages.indexOf(selectedPuzzle),
          screens: screens.map(s => {
            if (s.type === 'single') {
              return {
                type: 'single',
                q: {
                  topic: s.q.topic, visual: s.q.visual, text: s.q.text,
                  options: s.q.options, answer: s.q.answer, solution: s.q.solution,
                  globalIdx: s.q.globalIdx, screenIdx: s.q.screenIdx,
                  answered: s.q.answered, userChoice: s.q.userChoice
                }
              };
            } else {
              return {
                type: 'chain',
                topic: s.topic, context: s.context, visual: s.visual,
                steps: s.steps.map(st => ({
                  text: st.text, options: st.options, answer: st.answer, solution: st.solution,
                  globalIdx: st.globalIdx, screenIdx: st.screenIdx,
                  answered: st.answered, userChoice: st.userChoice
                }))
              };
            }
          }),
          currentScreenIdx, score, correctCount, playerName
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) { /* fail silently */ }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch(e) { return null; }
    }

    function clearState() {
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
    }

    function restoreFromState(state) {
      selectedPuzzle = puzzleImages[state.puzzleIdx] || puzzleImages[0];
      screens = [];
      allQuestionsFlat = [];

      state.screens.forEach(s => {
        if (s.type === 'single') {
          screens.push({ type: 'single', q: s.q });
          allQuestionsFlat.push(s.q);
        } else {
          screens.push(s);
          s.steps.forEach(st => allQuestionsFlat.push(st));
        }
      });

      currentScreenIdx = state.currentScreenIdx;
      score = state.score;
      correctCount = state.correctCount;

      initPuzzleGrid(selectedPuzzle);
      // Reveal вече отговорените плочки/сектори
      allQuestionsFlat.forEach(q => {
        if (q.answered) {
          const { tileIdx, sectorIdx } = findTileAndSector(q.globalIdx);
          const scr = screens[q.screenIdx];
          const isCorrect = q.userChoice === q.answer;
          if (scr.type === 'chain') {
            const sectorEl = document.getElementById(`tile-${tileIdx}-sec-${sectorIdx}`);
            if (sectorEl) {
              sectorEl.classList.add('revealed');
              sectorEl.classList.add(isCorrect ? 'correct' : 'wrong');
            }
            const meta = tileMeta[tileIdx];
            if (meta) {
              meta.sectorsRevealed++;
            }
          } else {
            const tileEl = document.getElementById(`tile-${tileIdx}`);
            if (tileEl) {
              tileEl.classList.add('revealed');
              tileEl.classList.add(isCorrect ? 'correct' : 'wrong');
            }
          }
        }
      });
      buildMap();
      updateUI();
      renderScreen();
    }

    function generateMission() {
      clearState();
      selectedPuzzle = puzzleImages[Math.floor(Math.random() * puzzleImages.length)];

      const allShorts = shuffle(getShortQuestions()).slice(0, 21);
      const allChains = shuffle(getChainTasks()).slice(0, 9);

      let mixedItems = [];
      allShorts.forEach(q => mixedItems.push({ type: 'single', data: q }));
      allChains.forEach(ch => mixedItems.push({ type: 'chain', data: ch }));
      mixedItems = shuffle(mixedItems);

      screens = [];
      allQuestionsFlat = [];
      let gIdx = 0;

      mixedItems.forEach((item, sIdx) => {
        if (item.type === 'single') {
          const qObj = { ...item.data, globalIdx: gIdx, screenIdx: sIdx, answered: false, userChoice: null };
          allQuestionsFlat.push(qObj);
          screens.push({ type: 'single', q: qObj });
          gIdx++;
        } else {
          const chainScreen = {
            type: 'chain', topic: item.data.topic, context: item.data.context,
            visual: item.data.visual, steps: []
          };
          item.data.steps.forEach(st => {
            const sObj = { ...st, globalIdx: gIdx, screenIdx: sIdx, answered: false, userChoice: null };
            allQuestionsFlat.push(sObj);
            chainScreen.steps.push(sObj);
            gIdx++;
          });
          screens.push(chainScreen);
        }
      });

      currentScreenIdx = 0;
      score = 0;
      correctCount = 0;
      initPuzzleGrid(selectedPuzzle);
      buildMap();
      updateUI();
      renderScreen();
      saveState();
    }

    function buildMap() {
      dotsEl.innerHTML = '';
      allQuestionsFlat.forEach((q, i) => {
        const btn = document.createElement('button');
        const isChained = screens[q.screenIdx].type === 'chain';
        btn.className = 'dot' + (isChained ? ' chained' : '');
        btn.textContent = i + 1;
        btn.onclick = () => jumpToScreen(q.screenIdx, i);
        btn.id = `dot-${i}`;
        if (q.answered) {
          btn.classList.add(q.userChoice === q.answer ? 'correct' : 'wrong');
        }
        dotsEl.appendChild(btn);
      });
    }

    function updateUI() {
      const answeredCount = allQuestionsFlat.filter(q => q.answered).length;
      const totalQs = allQuestionsFlat.length;
      document.getElementById('statQuestion').textContent = `${answeredCount}/${totalQs}`;
      document.getElementById('statScore').textContent = Math.round(score);
      document.getElementById('statCorrect').textContent = correctCount;

      const progressPercent = totalQs > 0 ? (answeredCount / totalQs) * 100 : 0;
      document.getElementById('progress').style.width = `${progressPercent}%`;

      if (answeredCount === totalQs && totalQs > 0) {
        document.getElementById('statLevel').textContent = "Завършена";
      } else {
        document.getElementById('statLevel').textContent = "Активна";
      }

      allQuestionsFlat.forEach((q, i) => {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) {
          dot.classList.remove('active');
          if (q.screenIdx === currentScreenIdx) dot.classList.add('active');
        }
      });
    }

    function jumpToScreen(sIdx, specificGlobalIdx) {
      currentScreenIdx = sIdx;
      updateUI();
      renderScreen();
      setTimeout(() => {
        if (specificGlobalIdx !== undefined) {
          const stepEl = document.getElementById(`step-g${specificGlobalIdx}`);
          if (stepEl) stepEl.scrollIntoView({behavior: 'smooth', block: 'center'});
        }
      }, 50);
    }

    function nextScreen() {
      // Намираме следващия екран в реда (не на първия неотговорен)
      let nextIdx = -1;
      for (let i = currentScreenIdx + 1; i < screens.length; i++) {
        const scr = screens[i];
        const hasUnanswered = scr.type === 'single'
          ? !scr.q.answered
          : scr.steps.some(s => !s.answered);
        if (hasUnanswered) { nextIdx = i; break; }
      }
      // Ако няма напред — пробваме отзад
      if (nextIdx === -1) {
        for (let i = 0; i < currentScreenIdx; i++) {
          const scr = screens[i];
          const hasUnanswered = scr.type === 'single'
            ? !scr.q.answered
            : scr.steps.some(s => !s.answered);
          if (hasUnanswered) { nextIdx = i; break; }
        }
      }

      if (nextIdx !== -1) {
        currentScreenIdx = nextIdx;
        updateUI();
        renderScreen();
        window.scrollTo({top: 0, behavior: 'smooth'});
      } else {
        renderEndScreen();
      }
    }

    window.handleOption = function(globalIdx, optIdx) {
      const q = allQuestionsFlat[globalIdx];
      if (q.answered) return;

      q.answered = true;
      q.userChoice = optIdx;
      const isCorrect = (optIdx === q.answer);

      // Звуков ефект
      if (isCorrect) playCorrect(); else playWrong();

      // Отваряне на правилния сектор от съответната плочка
      const { tileIdx, sectorIdx } = findTileAndSector(globalIdx);
      const scr = screens[q.screenIdx];

      if (scr.type === 'chain') {
        // Отваряме един сектор от триъгълно-секторираната плочка
        const sectorEl = document.getElementById(`tile-${tileIdx}-sec-${sectorIdx}`);
        if (sectorEl) {
          sectorEl.classList.add('revealed');
          sectorEl.classList.add(isCorrect ? 'correct' : 'wrong');
        }
        const meta = tileMeta[tileIdx];
        meta.sectorsRevealed++;
      } else {
        // Single tile — отваряме цялата плочка
        const tileEl = document.getElementById(`tile-${tileIdx}`);
        if (tileEl) {
          tileEl.classList.add('revealed');
          tileEl.classList.add(isCorrect ? 'correct' : 'wrong');
        }
      }

      const dot = document.getElementById(`dot-${globalIdx}`);
      if (isCorrect) {
        score += (100 / allQuestionsFlat.length);
        correctCount++;
        if (dot) dot.classList.add('correct');
      } else {
        if (dot) dot.classList.add('wrong');
      }

      updateUI();
      saveState();
      renderScreen();

      // Auto-scroll към следваща стъпка в комплексна задача
      setTimeout(() => {
        const screenObj = screens[currentScreenIdx];
        if (screenObj.type === 'chain') {
          const firstUnanswered = screenObj.steps.find(s => !s.answered);
          if (firstUnanswered) {
            const nextEl = document.getElementById(`step-g${firstUnanswered.globalIdx}`);
            if (nextEl) nextEl.scrollIntoView({behavior: 'smooth', block: 'center'});
          }
        }
      }, 100);

      // Проверка дали всичко е завършено
      if (allQuestionsFlat.every(qq => qq.answered)) {
        setTimeout(() => renderEndScreen(), 800);
      }
    };

    function renderFeedback(q) {
      if (!q.answered) return '';
      const isCorrect = q.userChoice === q.answer;
      const correctLetter = String.fromCharCode(1040 + q.answer);
      const correctText = q.options[q.answer];
      return `
        <div class="feedback show ${isCorrect ? 'good' : 'bad'}">
          <div class="feedback-title">${isCorrect ? '✓ Верен отговор!' : '✗ Грешен отговор. Верен е ' + correctLetter + ') ' + correctText}</div>
          ${q.solution ? `<div class="solution"><strong>Решение:</strong> ${q.solution}</div>` : ''}
        </div>
      `;
    }

    function renderScreen() {
      if (allQuestionsFlat.length > 0 && allQuestionsFlat.every(q => q.answered)) {
        renderEndScreen();
        return;
      }

      const scr = screens[currentScreenIdx];
      let html = "";

      if (scr.type === 'single') {
        const q = scr.q;
        const isAnswered = q.answered;

        const optionsHTML = q.options.map((opt, i) => {
          let cls = "option";
          if (isAnswered) {
            if (i === q.answer) cls += " correct";
            else if (i === q.userChoice) cls += " wrong";
          }
          return `<button class="${cls}" onclick="handleOption(${q.globalIdx}, ${i})" ${isAnswered ? 'disabled' : ''}>
                    <span class="prefix">${String.fromCharCode(1040 + i)})</span> ${opt}
                  </button>`;
        }).join('');

        const actionHTML = isAnswered
          ? `<button class="btn primary" onclick="nextScreen()">Следваща задача →</button>`
          : '';

        html = `
          <div class="topic-pill">${q.topic || 'Задача'} · Единична</div>
          <div class="visual-box">${q.visual}</div>
          <div class="step-box unlocked" id="step-g${q.globalIdx}">
            <div class="question-text">${q.text}</div>
            <div class="options">${optionsHTML}</div>
            ${renderFeedback(q)}
          </div>
          ${actionHTML}
        `;
      } else {
        // CHAIN
        let stepsHTML = '';
        let allAnswered = true;

        let firstUnansweredIdx = scr.steps.findIndex(s => !s.answered);
        if (firstUnansweredIdx === -1) firstUnansweredIdx = 999;

        scr.steps.forEach((step, idx) => {
          if (!step.answered) allAnswered = false;
          const isUnlocked = (idx <= firstUnansweredIdx);

          const optionsHTML = step.options.map((opt, oIdx) => {
            let cls = "option";
            if (step.answered) {
              if (oIdx === step.answer) cls += " correct";
              else if (oIdx === step.userChoice) cls += " wrong";
            }
            return `<button class="${cls}" onclick="handleOption(${step.globalIdx}, ${oIdx})" ${step.answered ? 'disabled' : ''}>
                      <span class="prefix">${String.fromCharCode(1040 + oIdx)})</span> ${opt}
                    </button>`;
          }).join('');

          const stepClass = isUnlocked ? (step.answered ? "step-box unlocked completed" : "step-box unlocked") : "step-box locked";

          const statusIcon = step.answered
            ? (step.userChoice === step.answer ? '✅' : '❌')
            : (isUnlocked ? '🔓' : '🔒');

          stepsHTML += `
            <div class="${stepClass}" id="step-g${step.globalIdx}">
              <div class="step-label">Стъпка ${idx + 1} <span class="status-icon">${statusIcon}</span></div>
              <div class="question-text">${step.text}</div>
              <div class="options">${optionsHTML}</div>
              ${renderFeedback(step)}
            </div>
          `;
        });

        const actionHTML = allAnswered
          ? `<button class="btn primary" onclick="nextScreen()">Следваща задача →</button>`
          : '';

        html = `
          <div class="topic-pill">${scr.topic || 'Задача'} · Комплексна (3 стъпки)</div>
          <div class="task-context"><strong>Дадено:</strong> ${scr.context}</div>
          <div class="visual-box">${scr.visual}</div>
          ${stepsHTML}
          ${actionHTML}
        `;
      }

      screenEl.innerHTML = html;
      renderMath(screenEl);
    }

    function createConfetti() {
      const colors = ['#1d4ed8', '#15803d', '#d97706', '#9333ea', '#0ea5e9'];
      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-10px';
        c.style.position = 'fixed';
        c.style.width = '8px';
        c.style.height = '8px';
        c.style.borderRadius = '50%';
        c.style.zIndex = '9999';
        c.style.animation = `fall ${Math.random() * 2 + 2}s linear forwards`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    const styleEl = document.createElement('style');
    styleEl.textContent = `@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }`;
    document.head.appendChild(styleEl);

    let reviewMode = false;

    function renderEndScreen() {
      document.getElementById('progress').style.width = `100%`;
      document.getElementById('statLevel').textContent = "Завършена";
      // Покажи името на картинката
      if (selectedPuzzle) {
        puzzleHintEl.textContent = selectedPuzzle.title;
      }

      // Финален звуков ефект (само първи път, не и при reload)
      if (!window._endSoundPlayed) {
        playComplete();
        window._endSoundPlayed = true;
      }

      const finalScore = Math.round(score);
      const wrongQuestions = allQuestionsFlat.filter(q => q.userChoice !== q.answer);

      let msg = "";
      if (finalScore >= 90) msg = "Блестящо! Алгоритмите и формулите са овладени.";
      else if (finalScore >= 70) msg = "Много добро ниво. Прегледайте грешките за перфектен резултат.";
      else if (finalScore >= 50) msg = "Имате добри основи, но е необходим допълнителен преговор.";
      else msg = "Резултатът показва пропуски. Упражнявайте повече базовите формули и алгоритми.";

      let reviewHTML = '';
      if (reviewMode && wrongQuestions.length > 0) {
        reviewHTML = '<div class="review-list">';
        wrongQuestions.forEach((q, i) => {
          const correctLetter = String.fromCharCode(1040 + q.answer);
          const userLetter = q.userChoice !== null ? String.fromCharCode(1040 + q.userChoice) : '—';
          reviewHTML += `
            <div class="review-item">
              <div class="topic-pill">Грешка ${i+1} · ${q.topic || 'Задача'}</div>
              <div class="rq">${q.text}</div>
              <div class="ra">Вашият отговор: <strong style="color: var(--bad);">${userLetter}) ${q.options[q.userChoice] || '—'}</strong></div>
              <div class="ra">Верен отговор: <strong style="color: var(--good);">${correctLetter}) ${q.options[q.answer]}</strong></div>
              ${q.solution ? `<div class="rsol"><strong>Решение:</strong> ${q.solution}</div>` : ''}
            </div>
          `;
        });
        reviewHTML += '</div>';
      }

      const reviewBtn = wrongQuestions.length > 0
        ? `<button class="btn secondary" onclick="toggleReview()">${reviewMode ? 'Скрий грешките' : `Прегледай грешките (${wrongQuestions.length})`}</button>`
        : '';

      screenEl.innerHTML = `
        <div id="resultCard" style="text-align: center; padding: 40px 0;">
          <h2 style="font-size: 28px; margin: 0 0 6px; color: var(--ink);">Резултат от подготовката</h2>
          <div style="font-size: 18px; color: var(--muted); margin-bottom: 14px;">Играч: <strong style="color: var(--ink);">${escapeHtml(playerName || '')}</strong></div>
          <div style="font-size: 80px; font-weight: 900; color: var(--primary); margin: 10px 0;">
            ${finalScore} т.
          </div>
          <p style="font-size: 18px; color: var(--muted); max-width: 500px; margin: 0 auto 24px; line-height: 1.6;">
            Успешно решени: <strong>${correctCount}</strong> от ${allQuestionsFlat.length}.<br>${msg}
          </p>
          ${selectedPuzzle ? `<div style="font-size: 14px; color: var(--muted); margin-bottom: 24px;">Открита картинка: <strong style="color: var(--ink);">${escapeHtml(selectedPuzzle.title)}</strong></div>` : ''}
          <div class="btn-row" style="max-width: 720px; margin: 0 auto; grid-template-columns: 1fr 1fr 1fr;">
            ${reviewBtn || '<div></div>'}
            <button class="btn secondary" id="copyResultBtn" onclick="copyResultImage()">📋 Копирай резултата</button>
            <button class="btn primary" onclick="generateMission()">↻ Нова мисия</button>
          </div>
          <div id="copyStatus" style="margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 1.4em;"></div>
          ${reviewHTML}
        </div>
      `;
      renderMath(screenEl);

      if (!reviewMode) {
        createConfetti();
        setTimeout(createConfetti, 500);
      }
      clearState();
    }

    // ===== Копиране на резултат като картинка =====
    window.copyResultImage = async function() {
      const statusEl = document.getElementById('copyStatus');
      if (statusEl) statusEl.textContent = 'Подготвям картинката...';

      try {
        const canvas = await buildResultCanvas();
        canvas.toBlob(async (blob) => {
          if (!blob) {
            if (statusEl) statusEl.textContent = '✗ Грешка при създаване на картинката.';
            return;
          }
          // Опит за clipboard
          try {
            if (navigator.clipboard && window.ClipboardItem) {
              await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
              if (statusEl) statusEl.innerHTML = '✓ Картинката е копирана! Сега я постави в чата (Ctrl+V).';
              playCorrect();
              return;
            }
            throw new Error('Clipboard API не се поддържа');
          } catch (e) {
            // Fallback: автоматичен download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rezultat-${(playerName || 'igrach').replace(/\s+/g, '_')}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            if (statusEl) statusEl.innerHTML = '⤓ Файлът е изтеглен (браузърът не поддържа копиране на картинка).';
            playCorrect();
          }
        }, 'image/png');
      } catch (e) {
        console.error(e);
        if (statusEl) statusEl.textContent = '✗ Грешка: ' + e.message;
      }
    };

    // Изобразява резултата в canvas (с пъзел картинката + текст)
    async function buildResultCanvas() {
      const W = 1200, H = 900;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Фон с градиент
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1d4ed8');
      grad.addColorStop(1, '#7c3aed');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Бяла рамка / карта
      const pad = 50;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = 8;
      roundRect(ctx, pad, pad, W - 2 * pad, H - 2 * pad, 24);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Заглавие
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.font = '700 36px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('Математически пъзел: Класна работа №2', W / 2, 130);

      // Име
      ctx.font = '500 28px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText('Играч: ' + (playerName || '—'), W / 2, 180);

      // Резултат — голяма цифра
      const finalScore = Math.round(score);
      ctx.font = '900 110px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#1d4ed8';
      ctx.fillText(finalScore + ' т.', W / 2, 320);

      // Брой верни
      ctx.font = '500 24px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(`Верни отговори: ${correctCount} от ${allQuestionsFlat.length}`, W / 2, 370);

      // Подзаглавие с име на картинката
      if (selectedPuzzle) {
        ctx.font = '600 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#7c3aed';
        ctx.fillText('Открита картинка: ' + selectedPuzzle.title, W / 2, 420);
      }

      // Зареди и нарисувай пъзел картинката
      if (selectedPuzzle && selectedPuzzle.src) {
        try {
          const img = await loadImage(selectedPuzzle.src);
          const imgMaxW = W - 2 * pad - 80;
          const imgMaxH = 350;
          const ratio = Math.min(imgMaxW / img.width, imgMaxH / img.height);
          const iw = img.width * ratio;
          const ih = img.height * ratio;
          const ix = (W - iw) / 2;
          const iy = 450;
          // Рамка
          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(ix - 4, iy - 4, iw + 8, ih + 8);
          ctx.drawImage(img, ix, iy, iw, ih);
        } catch (e) {
          console.warn('Не успях да заредя картинката:', e);
        }
      }

      // Долен ред — дата и кредит
      const date = new Date().toLocaleDateString('bg-BG', { day: 'numeric', month: 'long', year: 'numeric' });
      ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(date, W / 2, H - 80);
      ctx.font = 'italic 16px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('Идея: Валя Витковска  ·  Реализация: Claude', W / 2, H - 55);

      return canvas;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    window.toggleReview = function() {
      reviewMode = !reviewMode;
      renderEndScreen();
    };

    function showRestoreBanner() {
      const banner = document.getElementById('restoreBanner');
      banner.innerHTML = `
        <div class="restore-banner">
          <span>Намерена е незавършена сесия. Желаете ли да продължите?</span>
          <div>
            <button onclick="restorePrevSession()">Продължи</button>
            <button class="dismiss" onclick="dismissRestore()">Започни нова</button>
          </div>
        </div>
      `;
    }

    window.restorePrevSession = function() {
      const state = loadState();
      if (state) {
        restoreFromState(state);
        document.getElementById('restoreBanner').innerHTML = '';
      }
    };

    window.dismissRestore = function() {
      document.getElementById('restoreBanner').innerHTML = '';
      generateMission();
    };

    // ===== Старт на играта (извиква се след въвеждане на име) =====
    function bootGame() {
      const savedState = loadState();
      if (savedState && savedState.screens && savedState.screens.length > 0) {
        const totalSavedQs = savedState.screens.reduce((acc, s) => {
          return acc + (s.type === 'single' ? 1 : s.steps.length);
        }, 0);
        const answeredCount = savedState.screens.reduce((acc, s) => {
          if (s.type === 'single') return acc + (s.q.answered ? 1 : 0);
          return acc + s.steps.filter(st => st.answered).length;
        }, 0);
        // Възстанови играта само ако е същият играч
        const sameName = savedState.playerName && savedState.playerName === playerName;
        if (sameName && answeredCount > 0 && answeredCount < totalSavedQs) {
          showRestoreBanner();
          generateMission();
        } else {
          // Различен играч или завършена/нова сесия — изчисти и започни наново
          if (!sameName) clearState();
          generateMission();
        }
      } else {
        generateMission();
      }
    }
  </script>
